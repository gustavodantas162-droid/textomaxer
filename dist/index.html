  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23080909'/%3E%3Cpath d='M12 12h40v10H37v30H27V22H12z' fill='%23B38A3E'/%3E%3C/svg%3E">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');
    :root{--bg:#080909;--panel:#141616;--metal:#2A2D2D;--red:#8F1D1D;--gold:#B38A3E;--white:#F2F2ED;--muted:#9b9e99;--line:#323535;--ok:#6f8d61}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--white);font:16px/1.55 Inter,Arial,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 15% 0%,#31121255,transparent 30%),linear-gradient(#ffffff06 1px,transparent 1px);background-size:auto,100% 6px}
    button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.app{max-width:1120px;margin:auto;padding:20px}.hidden{display:none!important}
    .eyebrow{font:700 .78rem/1 Inter;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}.display,h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;margin:0;line-height:.92;letter-spacing:.01em}h1{font-size:clamp(3.3rem,12vw,7rem)}h2{font-size:clamp(2.2rem,7vw,4rem)}h3{font-size:1.7rem}p{color:#c5c7c2}.card{background:linear-gradient(145deg,#171919,#101111);border:1px solid var(--line);padding:22px;box-shadow:0 16px 45px #0008;position:relative}.card:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,var(--red),var(--gold),transparent)}
    .btn{border:1px solid var(--gold);background:var(--gold);color:#0c0c0b;padding:15px 20px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;min-height:52px;transition:.18s}.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}.btn.secondary{background:transparent;color:var(--white);border-color:#555}.btn.danger{background:transparent;border-color:#6b2a2a;color:#dc9292}.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}.input,.textarea{width:100%;background:#0c0d0d;border:1px solid #414444;color:var(--white);padding:14px;border-radius:0}.textarea{min-height:120px;resize:vertical}.muted{color:var(--muted);font-size:.88rem}
    .start{min-height:calc(100vh - 40px);display:grid;align-items:center;grid-template-columns:1.25fr .75fr;gap:40px}.logo{font:900 clamp(2.5rem,8vw,5.5rem)/.7 'Barlow Condensed';border-left:5px solid var(--red);padding-left:15px;margin-bottom:28px}.hero h1 span{color:var(--gold)}.benefits{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}.benefits span{border-left:2px solid var(--red);padding:7px 13px;background:#ffffff07;font-size:.85rem;text-transform:uppercase;font-weight:700}.start-form label{display:block;font-weight:700;margin-bottom:8px}.start-form .btn{width:100%;margin-top:12px}
    .topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0 18px;margin-bottom:28px}.mini-logo{font:900 1.45rem/.75 'Barlow Condensed';color:var(--white)}.mini-logo b{color:var(--gold)}.topnav{display:flex;gap:8px}.icon-btn{background:none;border:1px solid var(--line);color:var(--muted);padding:9px 12px}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:20px}.method-grid{display:grid;gap:14px;margin:24px 0}.method-grid .lesson-card{margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{border:1px solid var(--line);padding:14px;background:#0d0e0e}.stat strong{display:block;font:800 2rem 'Barlow Condensed';color:var(--gold)}.progress{height:9px;background:#272929;overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:.5s}.current{border-left:4px solid var(--red);margin-top:20px}.phase{margin:28px 0 12px;display:flex;align-items:center;gap:12px}.phase:after{content:"";height:1px;background:var(--line);flex:1}.phase-card{display:grid;grid-template-columns:160px 1fr;gap:16px;margin-top:28px;border:1px solid var(--line);background:#101212;overflow:hidden}.phase-card img{width:160px;height:145px;object-fit:cover;filter:saturate(.75) contrast(1.08)}.phase-card .phase-copy{padding:18px 18px 18px 0}.phase-card h3{font-size:1.6rem;margin:4px 0 8px}.phase-card p{margin:0;font-size:.9rem}.mission-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mission-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#111313;padding:13px;color:var(--white);text-align:left;min-height:64px}.mission-row:hover:not(:disabled){border-color:var(--gold)}.mission-row:disabled{opacity:.5;cursor:not-allowed}.mission-row.done{border-color:#47613e}.daynum{font:800 1.4rem 'Barlow Condensed';color:var(--gold);min-width:34px}.lock{margin-left:auto;color:#777}.countdown{font:700 1.05rem 'Barlow Condensed';color:var(--gold);letter-spacing:.05em}
    .diagnostic{max-width:780px;margin:40px auto}.question{margin:24px 0}.qhead{display:flex;justify-content:space-between;gap:15px;margin-bottom:8px}.score{color:var(--gold);font-weight:800}.range{width:100%;accent-color:var(--red)}.scale{display:flex;justify-content:space-between;color:#767a76;font-size:.75rem}.open-q{margin:20px 0}.open-q label{display:block;font-weight:700;margin-bottom:8px}.diagnostic .btn{width:100%;margin-top:15px}
    .mission{max-width:820px;margin:auto}.mission-head{padding:34px 0 20px;border-bottom:1px solid var(--line)}.mission-head .impact{font:600 1.25rem 'Barlow Condensed';color:var(--gold);text-transform:uppercase}.section{margin:24px 0}.section h3{font-size:1.05rem;letter-spacing:.14em;color:var(--gold);margin-bottom:8px}.section p{margin:0}.checklist{display:grid;gap:9px}.checkitem,.execute{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);padding:13px;background:#101212}.checkitem input,.execute input{width:20px;height:20px;accent-color:var(--red);flex:0 0 auto}.execute{border-color:var(--gold);margin:20px 0;font-weight:800}.mission-actions{display:flex;gap:10px}.mission-actions .btn{flex:1}.success{position:fixed;inset:auto 20px 20px;max-width:520px;margin:auto;background:#172018;border:1px solid #55734b;padding:17px;z-index:5;box-shadow:0 20px 50px #000;animation:up .3s}@keyframes up{from{transform:translateY(20px);opacity:0}}
    .lesson-card{background:#101212;border:1px solid var(--line);padding:18px;margin:16px 0}.lesson-card h3{margin:0 0 10px}.lesson-card p{margin:0 0 10px}.lesson-card p:last-child{margin-bottom:0}.lesson-card ul{margin:8px 0 0;padding-left:20px;color:#c5c7c2}.lesson-card li{margin:7px 0}.callout{border-left:3px solid var(--gold);background:#241d11;padding:15px 17px;margin:16px 0;color:#e2d8c2}.section .step-list{counter-reset:step;list-style:none;padding:0;margin:0}.step-list li{counter-increment:step;border:1px solid var(--line);padding:13px 14px 13px 48px;position:relative;margin:8px 0;color:#c5c7c2}.step-list li:before{content:counter(step);position:absolute;left:14px;top:12px;color:var(--gold);font:800 1.2rem 'Barlow Condensed'}.confirm-title{font:800 1rem 'Barlow Condensed';letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin:28px 0 10px}.backup{margin-top:18px;border-top:1px solid var(--line);padding-top:15px}.backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.backup-actions .btn{flex:1;min-width:140px}
    .demo{margin-top:35px;border-top:1px solid var(--line);padding-top:18px}.demo summary{cursor:pointer;color:#777;font-size:.8rem}.demo-controls{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}.final-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.compare{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.compare .gain{color:var(--gold);font-weight:800}.final-actions{display:flex;gap:10px}.disclaimer{border:1px solid #3a3d3d;padding:12px;color:#929590;font-size:.78rem;margin-top:20px}
    @media(max-width:760px){.app{padding:16px}.start,.grid{grid-template-columns:1fr}.start{align-content:center}.hero h1{font-size:3.4rem}.logo{font-size:3.1rem}.topnav{gap:5px}.topnav .icon-btn{font-size:.7rem;padding:8px 7px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat strong{font-size:1.55rem}.mission-list{grid-template-columns:1fr}.phase-card{grid-template-columns:105px 1fr}.phase-card img{width:105px;height:145px}.phase-card .phase-copy{padding:14px 12px 14px 0}.mission-actions,.final-actions{flex-direction:column}.final-grid{grid-template-columns:1fr}.card{padding:18px}.benefits{display:grid}.topbar{position:sticky;top:0;background:#080909ee;z-index:3;padding-top:8px}.qhead{font-size:.92rem}}

<body><main id="app" class="app"></main><div id="toast"></div>
<script>
const CLUB_URL='https://example.com/testo-maxer-club';
const RELEASE_INTERVAL_MS=24*60*60*1000;
const KEY='testoMaxing21D_v1';
const questions=['Energia durante o dia','Libido','Qualidade do sono','Disciplina','Satisfação com o físico','Qualidade da alimentação','Frequência de treino','Controle sobre telas e estímulos rápidos'];
const raw=[
['Encare seu estado atual','Seu corpo está mostrando os padrões que você repete.','A fuga e a autoimagem inventada. É fácil culpar idade, rotina ou falta de tempo sem observar o que realmente acontece durante o seu dia. Sem um retrato honesto, qualquer mudança vira tentativa solta.','Você não muda aquilo que se recusa a medir. Um ponto de partida claro tira o problema da névoa e transforma desconforto em decisão. Hoje não é sobre se julgar; é sobre enxergar padrões com precisão e assumir responsabilidade pelo próximo passo.','Registre seu ponto de partida sem suavizar a realidade.',['Revise as respostas do diagnóstico','Anote seu nível real de energia ao acordar','Identifique um hábito que mais cobra seu preço','Defina uma mudança concreta para hoje'],'O que sua rotina atual revela sobre o homem que você tem escolhido ser?'],
['Descubra o que está drenando sua energia','Cansaço constante também pode ser uma rotina mal desenhada.','Noites irregulares, excesso de estímulo, refeições improvisadas e sedentarismo formam pequenos vazamentos. Isolados parecem inofensivos; juntos consomem disposição e tornam o dia reativo.','Energia não depende apenas de vontade. Ela é influenciada pelas decisões repetidas antes mesmo de você perceber o cansaço. Mapear os vazamentos permite atacar causas práticas em vez de buscar atalhos ou se cobrar por não render.','Faça uma auditoria das últimas 24 horas.',['Liste três momentos de queda de energia','Anote o que aconteceu antes de cada queda','Escolha um vazamento para cortar hoje','Faça uma pausa curta sem tela'],'Qual comportamento está cobrando mais energia do que entrega?'],
['Limpe o ambiente alimentar','Você não precisa vencer uma batalha que não entra na sua casa.','Produtos ultraprocessados à vista, pedidos rápidos e despensa desorganizada tornam a pior escolha a mais fácil. Quando a fome chega, o ambiente costuma decidir antes da disciplina.','Disciplina cresce quando o ambiente reduz atrito para o básico. Retirar gatilhos frequentes não é fraqueza: é estratégia. Comida de verdade disponível transforma a boa escolha em padrão, não em uma prova diária de força de vontade.','Remova hoje os principais gatilhos alimentares do seu alcance.',['Escolha três itens que estimulam consumo automático','Retire-os da bancada ou da despensa','Coloque opções naturais visíveis','Planeje a próxima refeição antes da fome'],'Qual alimento costuma iniciar uma sequência de decisões ruins?'],
['Rompa com o piloto automático','O padrão que você não observa controla você.','Você abre a tela, belisca, adia o treino e dorme tarde quase sem decidir. O piloto automático economiza esforço, mas também repete comportamentos que enfraquecem seus objetivos.','Entre o impulso e a ação existe uma janela curta. Criar uma pausa consciente devolve escolha. Não é necessário mudar tudo hoje; é necessário flagrar o padrão e interrompê-lo uma vez de propósito.','Use a regra da pausa de 60 segundos antes de um hábito automático.',['Escolha um hábito automático para observar','Pare por 60 segundos quando o impulso vier','Nomeie o gatilho em voz baixa','Execute uma alternativa definida'],'Em qual momento do dia você mais entrega o controle ao automático?'],
['Recupere seu sono','A noite mal conduzida cobra juros no dia seguinte.','Horários instáveis, luz intensa, cafeína tardia e celular na cama mantêm o corpo em estado de alerta. Dormir vira o último item do dia, quando deveria preparar todos os outros.','Um ritual simples e repetível sinaliza encerramento. Regularidade, ambiente escuro e redução de estímulo ajudam o corpo a reconhecer a hora de desacelerar. Sono merece espaço protegido, não as sobras da rotina.','Defina e proteja seu horário de encerramento hoje.',['Escolha um horário realista para deitar','Reduza luzes 60 minutos antes','Deixe o quarto escuro e fresco','Afaste o celular da cama'],'O que você precisa parar de fazer para respeitar seu sono?'],
['Controle as telas','Sua atenção está sendo treinada por aquilo que você consome.','Rolagem infinita, notificações e vídeos curtos fragmentam atenção e estendem o dia sem entregar descanso. O excesso de estímulo torna tarefas simples mais difíceis e invade a noite.','Controlar telas não exige desaparecer do mundo. Exige criar limites claros para que a tecnologia volte a ser ferramenta. Blocos sem tela recuperam presença, reduzem consumo automático e abrem espaço para movimento e descanso.','Crie dois blocos protegidos sem telas.',['Passe os primeiros 30 minutos do dia sem feed','Faça uma refeição sem celular','Desative notificações não essenciais','Pare telas 60 minutos antes de dormir'],'Qual estímulo digital mais rouba seu tempo sem você perceber?'],
['Prove que consegue continuar','Consistência nasce quando você honra o próximo passo.','Depois do impulso inicial, a mente começa a negociar. Ela aponta falhas, minimiza avanços e procura uma saída confortável. É aqui que muitos abandonam um processo que mal começou.','A primeira semana não precisa ser perfeita para ser válida. Revisar o que funcionou transforma esforço em método. A vitória é identificar o padrão que você consegue repetir mesmo em dias comuns.','Revise a semana e escolha o padrão que continuará.',['Leia suas seis reflexões anteriores','Marque sua maior vitória prática','Identifique o principal obstáculo','Defina o mínimo da próxima semana'],'Que prova você já deu de que consegue agir diferente?'],
['Volte para a comida de verdade','Seu prato não precisa de marketing. Precisa de ingredientes reconhecíveis.','A rotina moderna trocou refeições por produtos prontos, sabores hiperestimulantes e decisões constantes. Isso facilita o excesso e afasta você dos sinais simples de fome e saciedade.','Uma base alimentar simples prioriza alimentos in natura ou minimamente processados, proteínas adequadas à sua realidade, vegetais, frutas e fontes tradicionais de energia. Sem extremismo: apenas menos embalagem e mais comida reconhecível.','Faça hoje uma refeição composta por alimentos de verdade.',['Escolha ingredientes reconhecíveis','Inclua uma fonte de proteína','Inclua vegetais ou fruta','Coma sentado e sem tela'],'Qual troca simples deixaria sua alimentação mais natural amanhã?'],
['Construa seu prato Testo Maxer','Simplicidade vence quando precisa ser repetida.','Sem uma estrutura básica, cada refeição vira uma nova decisão. A fome chega, você improvisa e o mais rápido vence. Complicação demais também faz o plano desmoronar.','Um prato consistente pode ser montado com uma fonte de proteína, alimentos vegetais variados, uma fonte de energia compatível com sua rotina e água. Ajuste quantidades à sua fome, objetivo e orientação profissional quando necessário.','Monte uma refeição usando a estrutura do prato base.',['Defina a proteína da refeição','Escolha dois alimentos vegetais','Adicione uma fonte simples de energia se necessário','Beba água e coma com atenção'],'Qual parte do seu prato costuma ser decidida sem intenção?'],
['Pare de ter medo da comida','Regras demais também afastam você do básico.','Listas infinitas de alimentos proibidos criam ansiedade, culpa e ciclos de tudo ou nada. A busca por perfeição pode transformar comida natural em problema e produto milagroso em solução.','Contexto importa. Um alimento isolado não define sua rotina; o padrão repetido define. Priorize qualidade, variedade e percepção do próprio corpo. Se houver condição clínica, sintomas ou restrições, procure um profissional qualificado.','Questione hoje uma regra alimentar que você segue sem entender.',['Escreva a regra em uma frase','Pergunte de onde ela veio','Observe como seu corpo responde sem obsessão','Mantenha o foco no padrão geral'],'Qual regra alimentar gera mais culpa do que clareza?'],
['Use o sol como parte da rotina','Seu corpo foi feito para reconhecer o dia.','Ambientes fechados, luz artificial e horas diante de telas afastam você dos sinais naturais de manhã e noite. Dias inteiros passam sem céu, caminhada ou mudança de luz.','Contato responsável com a luz natural ajuda a organizar a rotina e convida ao movimento. A exposição deve respeitar seu tipo de pele, clima, horário e orientação médica. O objetivo não é queimar: é voltar a viver também do lado de fora.','Inclua luz natural e movimento ao ar livre com segurança.',['Saia ao ar livre no início do dia se possível','Caminhe por alguns minutos','Evite queimaduras e excesso de exposição','Observe o ambiente sem usar o celular'],'O que impede você de passar alguns minutos do dia ao ar livre?'],
['Treine para se tornar mais forte','Seu treino deve construir capacidade, não punir seu corpo.','Treinar só quando há motivação ou buscar exaustão em toda sessão impede consistência. Comparação e ego ainda aumentam o risco de executar além da capacidade atual.','Força é construída com movimentos bem executados, progressão gradual e recuperação. Uma sessão simples e adaptada vale mais que um plano perfeito abandonado. Se estiver lesionado, sedentário ou tiver condição de saúde, procure orientação profissional.','Execute uma sessão de força adequada ao seu nível.',['Faça um aquecimento breve','Escolha 3 a 5 movimentos básicos','Priorize técnica e amplitude segura','Pare antes de perder a execução'],'Que capacidade física você quer construir nos próximos meses?'],
['Movimente-se além do treino','Uma hora de treino não apaga um dia inteiro parado.','A rotina sentada concentra todo movimento em uma pequena janela. Elevador, carro, reuniões e entretenimento reduzem passos sem que isso pareça uma decisão.','Movimento distribuído ao longo do dia mantém o corpo ativo e quebra períodos prolongados de inércia. Caminhadas curtas, escadas e pausas frequentes são ações pequenas que cabem em dias reais.','Acumule movimento em blocos curtos durante o dia.',['Faça três pausas ativas','Caminhe após uma refeição','Use escadas quando for seguro','Levante-se durante tarefas longas'],'Onde existe uma oportunidade óbvia de movimento que você ignora?'],
['Organize sua semana','O caos cobra decisões caras quando você está cansado.','Sem compras, horários e prioridades definidos, a semana vira reação. Faltam alimentos simples, o treino perde espaço e o sono é sacrificado para resolver atrasos.','Planejamento não serve para controlar tudo. Serve para proteger o essencial. Poucos compromissos marcados com clareza diminuem improviso e preservam hábitos quando o dia aperta.','Reserve 20 minutos para organizar os próximos sete dias.',['Defina dias e horários de treino','Planeje compras e refeições-base','Marque seu horário de sono','Antecipe o principal obstáculo da semana'],'Qual compromisso precisa entrar primeiro na agenda para realmente acontecer?'],
['Pare de negociar consigo mesmo','Toda negociação repetida ensina que sua palavra é opcional.','Você decide treinar, dormir cedo ou comer melhor, mas muda o acordo quando surge desconforto. Cada exceção parece pequena; juntas, elas enfraquecem confiança em si mesmo.','Um padrão mínimo reduz espaço para debate. Nos dias bons você faz mais. Nos dias difíceis, cumpre o mínimo. O valor está em manter a identidade ativa sem transformar um contratempo em abandono.','Defina um mínimo diário que cabe até no pior dia.',['Escolha um mínimo de movimento','Escolha um mínimo de alimentação','Escolha um limite noturno','Registre os três em local visível'],'Qual promessa pequena você pode parar de quebrar?'],
['Construa sua manhã','A primeira hora define quem assume o comando.','Começar o dia reagindo a mensagens e feeds entrega sua atenção antes de você definir prioridades. A mente entra em urgências alheias e o corpo continua imóvel.','Uma manhã simples cria direção: luz natural, água, movimento e uma prioridade clara. Não precisa ser longa nem performática. Precisa acontecer antes do consumo automático.','Execute uma manhã de 20 minutos sem feed.',['Beba água ao acordar','Busque luz natural','Movimente o corpo por alguns minutos','Defina a tarefa mais importante do dia'],'O que muda quando você começa o dia sem entregar sua atenção?'],
['Proteja sua atenção','Aquilo que interrompe você também treina você.','Alertas, abas abertas e interrupções constantes impedem profundidade. A sensação de estar ocupado substitui avanço real, e o fim do dia chega sem uma vitória concreta.','Atenção protegida exige barreiras visíveis. Um bloco de foco com ambiente limpo e notificações desligadas permite terminar o que importa. Presença também é uma forma de disciplina.','Faça um bloco de 45 minutos de foco sem interrupções.',['Escolha uma tarefa relevante','Deixe o celular fora do alcance','Feche abas e alertas','Trabalhe até o cronômetro terminar'],'Que distração você continua permitindo apesar de conhecer o custo?'],
['Fortaleça sua presença','Presença é percebida antes de qualquer discurso.','Postura fechada, fala hesitante, descuido pessoal e promessas não cumpridas comunicam ausência. Não se trata de posar ou intimidar, mas de ocupar o próprio lugar com responsabilidade.','Presença cresce quando corpo, palavra e ação apontam na mesma direção. Postura consciente, comunicação direta e autocuidado básico mostram que você se trata com respeito e oferece clareza aos outros.','Pratique presença deliberada em três interações.',['Ajuste a postura sem rigidez','Olhe nos olhos com naturalidade','Fale de forma clara e breve','Cumpra uma pequena responsabilidade pendente'],'Onde você tem diminuído sua presença para evitar desconforto?'],
['Elimine um comportamento incompatível','Uma identidade nova precisa de limites novos.','Alguns hábitos não são neutros: eles contradizem diretamente o homem que você decidiu construir. Mantê-los por conveniência prolonga uma versão que você já reconheceu como fraca.','Eliminar começa com precisão. Escolha um comportamento específico, identifique o gatilho e prepare uma resposta alternativa. Não prometa “nunca mais” de forma vazia; interrompa hoje e construa evidência.','Interrompa por 24 horas um comportamento incompatível.',['Nomeie o comportamento sem generalizar','Remova o gatilho mais próximo','Defina uma ação substituta','Avise alguém se isso ajudar na responsabilidade'],'Que comportamento já não combina com a identidade que você está construindo?'],

const lessonNotes=[
['Seu ponto de partida não é um diagnóstico médico. É um mapa de comportamento. Energia, sono, alimentação, treino e libido variam por muitas razões, e uma nota baixa isolada não prova testosterona baixa. O valor está em observar padrões repetidos e contexto.','Compare um dia comum com um dia em que você se sente melhor. O que muda? Horário, comida, luz, movimento e telas costumam revelar mais do que uma impressão solta.','Faça uma fotografia honesta, sem transformar desconforto em rótulo.'],
['O sono é um dos ambientes mais importantes para recuperação. Horário irregular, luz noturna e despertares frequentes podem reduzir disposição e atrapalhar os processos que sustentam desempenho. Uma noite ruim não define seus hormônios; semanas ruins merecem atenção.','Se você acorda cansado apesar de passar muitas horas na cama, observe regularidade, ronco, álcool, telas e temperatura. Persistência de sintomas pede avaliação profissional.','Escolha um horário de desligamento que consiga repetir, não uma promessa perfeita.'],
['A cozinha decide parte das escolhas antes da sua fome aparecer. Produtos prontos são fáceis de consumir rapidamente e difíceis de avaliar por ingredientes. Limpar o ambiente não é demonizar comida; é tornar comida reconhecível a opção disponível.','Certo: ovos, carne, frutas, raízes e água à vista. Errado: depender de força de vontade diante de pacotes abertos toda noite.','Faça compras com lista e deixe uma refeição simples pronta para amanhã.'],
['Ultraprocessado é produto formulado para conveniência e alta palatabilidade, geralmente com ingredientes e aditivos que você não usaria em casa. O protocolo proposto trabalha com ZERO ULTRAPROCESSADOS; isso é uma regra de ambiente, não uma promessa de cura.','Leia a lista: muitos ingredientes, aromatizantes e combinações que imitam comida são sinais para deixar o produto fora. Processar leite, congelar vegetais ou cozinhar não torna automaticamente algo ultraprocessado.','Planeje substituições reais para não depender de improviso quando a vontade aparecer.'],
['Telas não “desligam” o cérebro quando são usadas até dormir. Estímulo, luz, novidade e notificações mantêm atenção ativa e empurram o horário. O efeito sobre testosterona costuma ser indireto: sono pior, menos movimento e mais decisões impulsivas.','Se você perde 40 minutos rolando e depois acorda cansado, o problema é o ciclo, não apenas o aplicativo.','Crie zonas sem tela e use o celular fora do quarto sempre que possível.'],
['Álcool e hábitos incompatíveis afetam recuperação, sono, apetite e tomada de decisão. Não é necessário inventar uma relação hormonal direta para reconhecer que um ambiente de recuperação ruim atrapalha o objetivo.','Observe a sequência: consumo à noite, sono fragmentado, treino perdido e alimentação improvisada no dia seguinte.','Defina uma barreira concreta para as próximas 24 horas e registre como acorda.'],
['Consistência não significa acertar todos os dias. Significa revisar, corrigir e voltar rápido. A primeira semana serve para identificar onde o protocolo encontra resistência real.','Separe falha de identidade: perder uma ação é um evento; abandonar a revisão transforma o evento em padrão.','Faça uma auditoria curta e escolha apenas um ajuste prioritário.'],
['A Dieta da Selva é uma estrutura de comida reconhecível: carnes, ovos, peixes, frutas, vegetais, raízes, tubérculos, derivados naturais se tolerados, gorduras naturais e água. Ela não é uma prescrição individual nem promete elevar exames automaticamente.','Comida de verdade oferece densidade nutricional e reduz decisões sobre produtos de pacote. Ajuste quantidades ao seu objetivo e condição.','Monte um dia de refeições simples antes de começar a semana.'],
['O prato TestoMaxer organiza a refeição: uma fonte de proteína, vegetais ou frutas, uma fonte de energia conforme sua demanda e gordura suficiente para sabor e saciedade. A proporção muda com objetivo, apetite e gasto.','Perda de gordura exige contexto energético; ganho de músculo exige treino, proteína e energia suficientes. Nenhuma foto de prato conhece sua necessidade individual.','Use a estrutura como ponto de partida e observe fome, desempenho e recuperação.'],
['Proteína, gordura e carboidrato têm funções diferentes. Calorias representam energia total; não são vilãs nem licença para ignorar qualidade. Comer pouco demais pode piorar treino, humor, sono e recuperação.','Compare cortar tudo com ajustar porções: o segundo caminho preserva mais capacidade de treinar e manter massa muscular.','Registre uma refeição e identifique qual componente está faltando ou exagerado.'],
['Micronutrientes participam de processos essenciais, mas mais não significa melhor. Vitamina D, zinco, magnésio, selênio, iodo e ferro devem ser pensados em fontes alimentares e contexto. Deficiência é diferente de usar megadose por esperança.','Carne, ovos, frutos do mar, laticínios, vegetais, frutas e raízes ampliam variedade. Suplemento só faz sentido quando há necessidade definida com profissional.','Mapeie variedade da semana antes de comprar qualquer produto.'],
['Luz natural ajuda a marcar o começo do dia e o ciclo claro-escuro. O objetivo não é bronzear nem se expor até queimar. É sair do ambiente fechado, movimentar-se e dar ao corpo sinais consistentes de horário.','Manhã sem luz, noite com tela forte e horários variáveis confundem a rotina. O efeito sobre hormônios é principalmente via sono e ritmo.','Combine luz natural com caminhada curta e horário de dormir previsível.'],
['Força é capacidade construída por prática, técnica e progressão. Exercícios compostos podem ser úteis, mas o melhor plano é o que você executa com segurança e recupera. Treinar até acumular dor e exaustão não é sinônimo de estímulo produtivo.','Registre carga, repetições e percepção de esforço. Se a técnica degrada, a sessão passou do ponto.','Escolha poucos movimentos e deixe margem para repetir na próxima semana.'],
['Movimento diário soma-se ao treino formal. Caminhadas, pausas em pé e escadas reduzem longos períodos de inatividade e ajudam a composição corporal. Não é uma competição de passos.','Se você treina uma hora e passa as outras dez sentado, há espaço para uma mudança simples.','Coloque três pausas de movimento na agenda e cumpra a primeira antes de negociar.'],
['Composição corporal envolve gordura, massa muscular, cintura, força e trajetória, não apenas peso. Excesso de gordura visceral está associado a pior ambiente metabólico, mas medidas isoladas não contam toda a história.','Emagrecer agressivamente pode reduzir desempenho e recuperação. Melhorar gradualmente, preservando músculo, costuma ser mais sustentável.','Escolha uma métrica principal e uma secundária para acompanhar semanalmente.'],
['Recuperar é adaptar-se ao treino e à vida. Descanso, comida suficiente, sono e dias leves permitem que o estímulo vire capacidade. Fadiga constante, queda de desempenho e irritabilidade são sinais para revisar carga e rotina.','Mais sessões não compensam pouca recuperação. O corpo não diferencia uma planilha ambiciosa de uma demanda real quando ambas ultrapassam sua capacidade.','Agende um bloco de recuperação como compromisso, não como prêmio.'],
['Estresse agudo ajuda a responder a um desafio; estresse crônico sem pausa mantém o sistema em alerta. O cortisol não é inimigo, e não existe hack simples para “zerá-lo”. O objetivo é reduzir demandas desnecessárias e criar recuperação.','Trabalho sem limite, treino pesado e sono curto podem se somar. Caminhada, natureza, lazer e organização são ferramentas de carga, não fraqueza.','Identifique a demanda que pode ser reduzida ou renegociada hoje.'],
['Ambiente é arquitetura de comportamento. Deixar água, comida simples, roupa de treino e horário visível reduz decisões. O mesmo vale para retirar notificações, álcool e pacotes do alcance.','Não confie em motivação para vencer um ambiente que foi desenhado contra você. Facilite o primeiro passo e dificulte o impulso.','Faça três mudanças físicas no seu espaço antes do fim do dia.'],
['Boosters, tribulus, retenção seminal e hacks virais prometem uma causa simples para um sistema complexo. Evidência de marketing não é evidência de aumento sustentado de testosterona. Creatina pode ajudar desempenho, mas não é um “booster hormonal” mágico.','Pergunte: qual é a promessa, qual é a evidência, qual o risco e o que acontece se eu não comprar?','Ignore uma compra impulsiva e registre quais pilares básicos ainda estão pendentes.'],
['Exames são dados dentro de um contexto. Testosterona total, livre, SHBG, LH, FSH e outros marcadores dependem de horário, método, sintomas e história. Um resultado isolado não é diagnóstico nem autorização para automedicação.','Se houver sintomas persistentes, alterações repetidas ou preocupação real, procure médico. Estilo de vida e tratamento clínico são caminhos diferentes e podem coexistir com orientação.','Monte uma lista objetiva de sintomas, horários e perguntas para uma consulta se necessário.'],
['O protocolo permanente transforma conhecimento em manutenção. Ele precisa caber numa terça-feira difícil: comida base, horário de sono, treino possível, luz, movimento, recuperação e revisão. O plano não deve depender da contagem regressiva.','Use três níveis: mínimo diário, revisão semanal e avaliação mensal. Assim você corrige cedo, antes que um deslize vire abandono.','Escreva o seu protocolo com ações observáveis, não adjetivos como “ser saudável”.']

const methodModules=[
['01 — ENTENDA SUA TESTOSTERONA','Testosterona é um hormônio produzido principalmente nos testículos sob comando do eixo hipotálamo–hipófise–gônadas. O hipotálamo sinaliza, a hipófise libera LH e FSH, e os testículos respondem. Testosterona total é o total medido no sangue; a livre é a fração disponível; SHBG influencia quanto fica ligado.','Os níveis variam ao longo do dia e dependem de sono, idade, composição corporal, doenças, medicamentos e método do exame. Libido, energia e masculinidade não são sinônimos de testosterona. Sintomas isolados não fecham diagnóstico; sinais persistentes justificam conversa com profissional.'],
['02 — O QUE DERRUBA SUA TESTOSTERONA','Obesidade, gordura visceral, sedentarismo, privação de sono, déficit calórico extremo, álcool, estresse crônico e excesso de treino sem recuperação podem piorar o ambiente metabólico e hormonal. Doenças e alguns medicamentos também interferem e exigem avaliação médica.','Separe evidência de narrativa: sono ruim pode afetar recuperação; isso é diferente de afirmar que qualquer tela “destrói” testosterona. O método atua nos fatores modificáveis sem prometer resultado clínico.'],
['03 — DIETA DA SELVA','A Dieta da Selva prioriza carne, ovos, peixes, frutos do mar, frutas, vegetais, raízes, tubérculos, laticínios naturais se tolerados, azeite, manteiga, gorduras naturais, mel e água. A regra proposta é ZERO ULTRAPROCESSADOS.','Aprenda a ler ingredientes, limpar a despensa, montar compras e preparar refeições simples. Comida processada não é automaticamente ultraprocessada; o contexto e o grau de formulação importam.'],
['04 — PRATO TESTOMAXER','Uma refeição pode combinar proteína, vegetais ou frutas, carboidrato conforme gasto e gordura suficiente para sabor e saciedade. Calorias representam energia; déficit favorece perda de gordura, manutenção sustenta peso e superávit pode apoiar ganho, sempre com contexto.','Quantidade não é universal. Ajuste por fome, desempenho, medidas e objetivo. Dietas restritivas demais podem reduzir energia, treino e recuperação.'],
['05 — MICRONUTRIENTES','Vitamina D, zinco, magnésio, selênio, iodo e ferro participam de funções essenciais. Fontes alimentares e variedade são a primeira linha. Deficiência confirmada é diferente de tomar megadoses.','Mais suplemento não significa mais testosterona. Exames, sintomas, dieta e orientação profissional definem quando investigar ou suplementar.'],
['06 — COMPOSIÇÃO CORPORAL','Gordura visceral e resistência à insulina se relacionam a pior ambiente metabólico. Massa muscular melhora capacidade, força e gasto, mas o peso isolado não conta toda a história.','Acompanhe cintura, peso, força, fotos e tendência. Perder gordura preservando músculo exige progressão, proteína, sono e um déficit que você consiga sustentar.'],
['07 — FORÇA E TREINAMENTO','Musculação fornece estímulo para força e massa. Progressão de carga, volume, intensidade, frequência e técnica devem caber na recuperação. Exercícios compostos são ferramentas, não obrigação.','Treinar forte não é acumular fadiga. Inclua cardio e passos para saúde, mantenha dias leves e adapte tudo à sua capacidade ou orientação profissional.'],
['08 — SONO E RITMO CIRCADIANO','Sono regular, ambiente escuro, temperatura confortável, luz natural pela manhã e menos estímulo à noite sustentam recuperação. Cafeína tardia, telas e horários variáveis podem atrapalhar.','Protocolo noturno: horário consistente, luz baixa, celular fora da cama, quarto escuro e rotina curta. Ronco alto, pausas respiratórias e sonolência persistente merecem investigação.'],
['09 — ESTRESSE E RECUPERAÇÃO','Cortisol é parte normal da resposta ao estresse. O problema é demanda crônica sem pausas, somada a trabalho, treino e sono insuficiente. Recuperação física e mental são componentes do método.','Caminhadas, natureza, lazer, respiração, organização e descanso reduzem carga percebida. Observe queda de desempenho, irritabilidade e fadiga acumulada.'],
['10 — O AMBIENTE MODERNO','Sedentarismo, ultraprocessados, telas, pouca luz natural, álcool e rotina desorganizada afastam comportamentos favoráveis. Quando há relação hormonal, ela costuma ser indireta via sono, obesidade, estresse e recuperação.','O objetivo não é culpar tecnologia. É desenhar um ambiente que facilite comida, movimento, luz, sono e atenção.'],
['11 — TESTOSTERONA SEM CHARLATANISMO','Boosters, tribulus, banho gelado, retenção seminal e hacks virais prometem atalhos. Creatina pode apoiar desempenho, mas não é um elevador hormonal mágico. Zinco, magnésio e vitamina D ajudam quando existe necessidade, não por megadose.','Pergunte o que prometem, qual evidência existe, qual risco há e se o básico já foi feito. Marketing vende certeza; o método trabalha com contexto.'],
['12 — EXAMES E ACOMPANHAMENTO','Testosterona total, livre, SHBG, LH, FSH e prolactina quando indicada precisam de horário, método, sintomas e histórico. Resultado anormal costuma ser interpretado em conjunto e, quando orientado, repetido.','O InfoApp não diagnostica nem prescreve. Procure médico diante de sintomas persistentes, alterações relevantes ou dúvidas sobre tratamento.'],
['13 — PROTOCOLO TESTOMAXER PERMANENTE','Depois dos 21 dias, mantenha alimentação, sono, treino, movimento, luz natural, composição corporal, recuperação, estresse, ambiente e acompanhamento. Use checklist diário, revisão semanal e avaliação mensal.','O protocolo permanente deve ser observável: horário, refeição-base, sessão, caminhada, limite de tela e revisão. Pequeno o bastante para durar; claro o bastante para corrigir.']

const moduleExtras=[
'<h3>Como funciona o eixo</h3><p><b>Hipotálamo → GnRH → hipófise → LH/FSH → testículos.</b> O LH estimula as células de Leydig a produzirem testosterona; o FSH participa da espermatogênese. O próprio sistema faz feedback e ajusta os sinais. As adrenais também produzem precursores androgênicos, mas os testículos são a principal fonte masculina.</p><h3>O que ela influencia</h3><p>Função sexual, libido, produção de espermatozoides, massa muscular, força, densidade óssea, formação de células sanguíneas, distribuição de gordura e características sexuais. Isso não transforma testosterona em medida de masculinidade: confiança, energia e desempenho também dependem de sono, saúde mental, estresse, doenças e medicamentos.</p><div class="callout">Sintomas isolados não diagnosticam testosterona baixa. Investigação combina sinais persistentes, exames adequados e contexto.</div>',
'<h3>O que realmente pesa</h3><ul><li>Obesidade e gordura visceral podem acompanhar pior saúde metabólica e hipogonadismo funcional.</li><li>Sono curto, fragmentado ou apneia prejudicam recuperação.</li><li>Déficit energético extremo, baixa ingestão nutricional e excesso de treino podem reduzir desempenho.</li><li>Álcool, doenças testiculares/hipofisárias/hipotalâmicas e alguns medicamentos exigem avaliação.</li></ul><h3>Evidência x narrativa</h3><p>Telas não “destroem” testosterona diretamente; podem atrasar o sono, aumentar sedentarismo e manter estímulo. Já obesidade, privação de sono e doenças têm relação mais consistente. Nunca interrompa medicação sozinho.</p>',
'<h3>Base da Dieta da Selva</h3><p><b>Zero ultraprocessados dentro do protocolo.</b> Priorize carne bovina, aves, cordeiro, porco, ovos, peixes, sardinha, salmão, frutos do mar, frutas, folhas, legumes, batata, batata-doce, mandioca, inhame, leite/iogurte natural/queijo quando tolerados, azeite, manteiga, abacate, mel e água.</p><h3>O que sai</h3><p>Refrigerantes, salgadinhos, bolachas, doces industriais, cereais açucarados, fast-food ultraprocessado, bebidas açucaradas, energéticos açucarados, margarinas e molhos complexos. Industrializado não significa automaticamente ultraprocessado: manteiga, azeite, queijo e iogurte natural podem continuar.</p><h3>Mercado</h3><p>Compre primeiro proteínas, depois frutas/raízes, vegetais, gorduras, laticínios e extras. Leia ingredientes: açúcares adicionados, aromatizantes, corantes, emulsificantes e formulações complexas são sinais para deixar o produto.</p>',
'<h3>Os quatro componentes</h3><ul><li><b>Proteína:</b> carne, ovos, peixe, frutos do mar ou laticínios.</li><li><b>Carboidrato:</b> frutas, batata, mandioca e outros tubérculos conforme gasto.</li><li><b>Micronutrientes:</b> variedade de frutas, vegetais e alimentos animais.</li><li><b>Gordura:</b> naturalmente da refeição, azeite, manteiga ou abacate.</li></ul><h3>Energia</h3><p>Déficit é consumir menos do que gasta; manutenção é aproximar ingestão do gasto; superávit é consumir mais. Excesso crônico pode elevar gordura; restrição extrema pode prejudicar treino e recuperação. Quantidades dependem de peso, atividade e objetivo.</p>',
'<h3>Fontes e cautela</h3><p><b>Zinco:</b> carnes, frutos do mar e ovos. <b>Magnésio:</b> vegetais, leguminosas, sementes e alimentos variados. <b>Vitamina D:</b> luz solar responsável e alimentos. <b>Selênio:</b> peixes, ovos e carnes; excesso também é problema. <b>Iodo:</b> tireoide e sal iodado conforme orientação. <b>Ferro:</b> transporte de oxigênio e carnes.</p><div class="callout"><b>Corrigir uma deficiência ≠ tomar megadoses para aumentar testosterona.</b> Comida primeiro; suplemento apenas quando houver indicação.</div>',
'<h3>Medidas úteis</h3><p>Observe cintura, peso, percentual de gordura quando confiável, massa magra, força e tendência. A relação importante é <b>excesso de gordura → pior saúde metabólica → maior probabilidade de alterações hormonais</b>. Emagrecer preservando músculo pede déficit moderado, proteína suficiente, musculação, movimento e sono.</p><p>Não transforme balança em julgamento diário. Compare médias e medidas ao longo de semanas.</p>',
'<h3>Treinamento TestoMaxer</h3><p>Treino fornece estímulo; adaptação acontece com treino + alimentação + recuperação. Use sobrecarga progressiva por carga, repetições, séries, técnica, amplitude ou controle. Padrões úteis: agachar, empurrar, puxar, hinge/levantar e carregar.</p><h3>Cardio e movimento</h3><p>Musculação e cardio não competem: cardio melhora condicionamento e saúde cardiovascular. Caminhar, subir escadas, trabalhar em pé, esportes e tarefas domésticas evitam treinar uma hora e passar as outras quinze completamente sedentário.</p>',
'<h3>Protocolo de sono</h3><ul><li><b>Manhã:</b> acorde em horário relativamente consistente, busque luz natural e movimente-se.</li><li><b>Dia:</b> tenha atividade e administre cafeína conforme sua sensibilidade.</li><li><b>Noite:</b> reduza estímulos e iluminação intensa; desacelere.</li><li><b>Quarto:</b> escuro, silencioso, confortável e com temperatura adequada.</li></ul><p>O ritmo circadiano usa luz e escuridão para organizar vigília e sono. Telas afetam principalmente horário, duração e qualidade do sono. Ronco intenso, pausas respiratórias, sonolência diurna e acordar sem recuperação pedem investigação.</p>',
'<h3>Estresse agudo x crônico</h3><p>Cortisol não é hormônio do mal: é necessário à vida. O problema é passar longos períodos sem recuperação, somando trabalho, problemas pessoais, dieta ruim, treino e sono curto.</p><p>Recupere com dias leves, caminhada, natureza, lazer, contato social, organização e descanso. Queda de performance, irritabilidade e fadiga acumulada são sinais para revisar carga.</p>',
'<h3>Engenharia ambiental</h3><p>O ambiente moderno facilita sedentarismo, comida hiperpalatável, excesso calórico, telas e rotina caótica. Não é conspiração; é comportamento facilitado.</p><ul><li>Comer melhor: compre antes, deixe proteína disponível e retire ultraprocessados.</li><li>Treinar: horário, academia, roupa e rotina definidos.</li><li>Dormir: celular longe e quarto preparado.</li><li>Movimentar: deslocamentos e caminhadas após refeições.</li></ul><p>Tor­ne o comportamento desejado fácil e o indesejado difícil.</p>',
'<h3>O que prometem x o que sabemos</h3><p>Boosters e tribulus vendem atalhos; evidência consistente é limitada. Zinco, magnésio e vitamina D fazem sentido principalmente quando ingestão/estado estão inadequados. Creatina é útil para força, massa e desempenho, não um booster hormonal mágico. Banho gelado pode ser preferência, não pilar. Retenção seminal separa experiência subjetiva de alegação de aumento sustentado.</p><h3>Analise qualquer hack</h3><p>Foi estudado em homens? Eram saudáveis? O efeito foi temporário? Houve controle e replicação? Foi testosterona total ou livre? Foi clinicamente relevante ou só mudou um número?</p>',
'<h3>Investigação educacional</h3><p>Testosterona total, livre, SHBG, LH, FSH e prolactina quando indicada ajudam o médico a investigar. Horário da coleta, método, sintomas e contexto importam; resultados anormais podem precisar ser repetidos pela manhã.</p><p>Hipogonadismo primário aponta principalmente para testículos; secundário envolve hipotálamo/hipófise. Sintomas persistentes, disfunção erétil, infertilidade, alterações testiculares, suspeita de apneia ou exames repetidamente baixos justificam consulta. Nunca use TRT ou interrompa remédio por conta própria.</p>',
'<h3>Checklist permanente</h3><p><b>Diário:</b> refeição-base, água, luz, movimento, treino possível e horário de sono. <b>Semanal:</b> compras, sessões, cintura/peso, fadiga e consistência. <b>Mensal:</b> revisar evolução, ambiente, metas e necessidade de acompanhamento.</p><p>Você não procura alimento mágico, suplemento mágico ou hack hormonal. Constrói um organismo e um ambiente capazes de funcionar bem de forma consistente. O método não é TRT, terapia hormonal ou tratamento para hipogonadismo, e não promete níveis específicos.</p>'
];
function methodView(){return `${header()}<section class="diagnostic"><span class="eyebrow">Área educacional permanente</span><h1 style="font-size:clamp(3rem,9vw,5.8rem)">Método<br><span style="color:var(--gold)">TestoMaxer</span></h1><p>Aprenda os pilares antes de executar o Protocolo 21D. Esta área fica sempre aberta.</p><div class="method-grid">${methodModules.map((mod,i)=>`<article class="lesson-card"><span class="eyebrow">Módulo ${i+1}</span><h2 style="font-size:2rem;margin:8px 0 12px">${mod[0]}</h2><p>${mod[1]}</p><p>${mod[2]}</p>${moduleExtras[i]}<div class="callout"><b>APLICAÇÃO:</b> Use este módulo como referência enquanto executa os desafios diários.</div></article>`).join('')}</div><button class="btn" onclick="go('dashboard')">Ir para o Protocolo 21D</button></section>`}
const blank=()=>({name:'',startedAt:null,initial:null,final:null,completed:[],reflections:{},checks:{},demoDay:1,maxStreak:0});
let state=load(); let view=state.name?(state.initial?'dashboard':'diagnostic'):'start'; let activeDay=1;
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return blank()}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function header(){return `<header class="topbar"><div class="mini-logo">TESTO<br>MAXING <b>21D</b></div><nav class="topnav"><button class="icon-btn" onclick="go('method')">MÉTODO</button><button class="icon-btn" onclick="go('dashboard')">PROTOCOLO 21D</button></nav></header>`}
function go(v){view=v;scrollTo(0,0);render()}
function render(){let el=document.querySelector('#app');el.innerHTML=view==='start'?startView():view==='diagnostic'?diagView('initial'):view==='dashboard'?dashView():view==='method'?methodView():view==='mission'?missionView():view==='finalDiag'?diagView('final'):finalView();bind()}
function startView(){return `<section class="start"><div class="hero"><div class="logo">TESTO<br>MAXING <span style="color:var(--gold)">21D</span></div><span class="eyebrow">Protocolo natural de 21 dias</span><h1>Reconstrua o homem que a vida moderna <span>enfraqueceu.</span></h1><p>Durante os próximos 21 dias, construa uma rotina voltada para mais energia, força, libido, disciplina e vitalidade masculina.</p><div class="benefits"><span>Uma missão por dia</span><span>Ação acima de teoria</span><span>Progresso registrado</span></div></div><form id="startForm" class="card start-form"><label for="name">Como você quer ser chamado?</label><input id="name" class="input" maxlength="32" autocomplete="name" required placeholder="Seu nome"><button class="btn">Iniciar meu protocolo</button><p class="muted">Seus dados ficam salvos neste dispositivo.</p><div class="disclaimer">Este programa é educacional e não substitui avaliação médica ou orientação profissional.</div></form></section>`}
function diagView(type){let existing=type==='initial'?state.initial:state.final;return `${header()}<section class="diagnostic"><span class="eyebrow">${type==='initial'?'Avaliação inicial':'Avaliação final'}</span><h2>${type==='initial'?'Antes de reconstruir, encare seu estado atual.':'Compare. Reconheça. Continue.'}</h2><p>${type==='initial'?'Responda com honestidade. No final dos 21 dias, você voltará a estas respostas.':'Use a mesma honestidade do primeiro dia. A evolução percebida importa.'}</p><form id="diagForm">${questions.map((q,i)=>`<div class="question"><div class="qhead"><label for="q${i}">${i+1}. ${q}</label><b class="score" id="s${i}">${existing?.scores?.[i]??5}</b></div><input class="range" id="q${i}" name="q${i}" type="range" min="0" max="10" value="${existing?.scores?.[i]??5}"><div class="scale"><span>0</span><span>10</span></div></div>`).join('')}${type==='initial'?['Qual hábito mais enfraquece você atualmente?','O que mais incomoda no seu corpo e na sua rotina?','O que você espera reconstruir nos próximos 21 dias?'].map((q,i)=>`<div class="open-q"><label for="o${i}">${q}</label><textarea class="textarea" id="o${i}" required>${esc(existing?.open?.[i]||'')}</textarea></div>`).join(''):`<div class="open-q"><label for="o0">Qual mudança mais importante você percebeu?</label><textarea class="textarea" id="o0" required>${esc(existing?.open?.[0]||'')}</textarea></div><div class="open-q"><label for="o1">Qual compromisso você manterá nos próximos 30 dias?</label><textarea class="textarea" id="o1" required>${esc(existing?.open?.[1]||'')}</textarea></div>`}<button class="btn">${type==='initial'?'Salvar e encarar o dia 1':'Salvar avaliação final'}</button></form></section>`}
function unlocked(){return Math.min(21,Math.max(state.demoDay||1,Math.floor((Date.now()-state.startedAt)/RELEASE_INTERVAL_MS)+1))}function streak(){let s=0;for(let i=1;i<=21;i++){if(state.completed.includes(i))s++;else break}return s}
function dashView(){let done=state.completed.length,u=unlocked(),next=Math.min(21,done+1),phase=missions[Math.min(next-1,20)].phase,pct=Math.round(done/21*100);if(done===21&&!state.final)return finalDiagKick();if(done===21&&state.final)return finalView();return `${header()}<section><span class="eyebrow">Bem-vindo de volta, ${esc(state.name)}</span><h1 style="font-size:clamp(3rem,8vw,5.5rem)">Dia ${next}. Reconstrua-se.</h1><div class="stats"><div class="stat"><strong>${done}/21</strong><span>Missões</span></div><div class="stat"><strong>${streak()}</strong><span>Sequência</span></div><div class="stat"><strong>${pct}%</strong><span>Progresso</span></div></div><div class="progress" aria-label="${pct}% concluído"><i style="width:${pct}%"></i></div><div class="grid"><div><div class="card current"><span class="eyebrow">Missão disponível · ${phase}</span><h2>${missions[next-1].title}</h2><p>${missions[next-1].impact}</p>${next<=u?`<button class="btn" onclick="openMission(${next})">Abrir missão ${next}</button>`:`<p class="countdown" id="countdown">Próxima missão em...</p>`}</div>${[0,1,2].map(p=>`<div class="phase-card"><img src="${phaseInfo[p].img}" alt="${phaseInfo[p].name}"><div class="phase-copy"><span class="eyebrow">Fase ${p+1}</span><h3>${phaseInfo[p].name}</h3><p>${phaseInfo[p].desc}</p></div></div><div class="phase"><span class="eyebrow">Dias ${p*7+1}–${p*7+7}</span></div><div class="mission-list">${missions.slice(p*7,p*7+7).map(m=>`<button class="mission-row ${state.completed.includes(m.day)?'done':''}" onclick="openMission(${m.day})"><span class="daynum">${String(m.day).padStart(2,'0')}</span><span>${m.title}</span><span class="lock">${state.completed.includes(m.day)?'✓':m.day>u?'◌ conteúdo aberto':'→'}</span></button>`).join('')}</div>`).join('')}</div><aside><div class="card"><span class="eyebrow">Fase atual</span><h3>${phase}</h3><p>Seu corpo responde ao ambiente que você constrói todos os dias.</p></div><details class="demo"><summary>Modo de demonstração</summary><div class="demo-controls"><button class="btn secondary" onclick="demoNext()">Liberar próximo dia</button><button class="btn danger" onclick="resetAll()">Apagar e reiniciar</button></div></details><div class="disclaimer">Sem suplementos, TRT, medicamentos ou promessas clínicas. Adapte atividades à sua condição e procure um profissional quando necessário.</div></aside></div></section>`}
function finalDiagKick(){view='finalDiag';return diagView('final')}
function openMission(d){activeDay=d;view='mission';render()}
function missionView(){let m=missions[activeDay-1],done=state.completed.includes(activeDay),available=activeDay<=unlocked(),saved=state.checks[activeDay]||[],note=lessonNotes[activeDay-1];return `${header()}<article class="mission"><div class="mission-head"><span class="eyebrow">Dia ${m.day} · ${m.phase}</span><h1 style="font-size:clamp(3rem,9vw,5.5rem)">${m.title}</h1><p class="impact">${m.impact}</p>${available||done?'':'<div class="disclaimer">CONTEÚDO ABERTO · O desafio e o registro deste dia serão liberados no horário correto.</div>'}</div><div class="lesson-card"><h3>1. O que você vai aprender</h3><p>${note[0]}</p></div><div class="lesson-card"><h3>2. Aula prática</h3><p>${m.enemy}</p><p>${m.principle}</p><div class="callout"><b>POR QUE ISSO IMPORTA:</b> ${note[1]}</div></div><div class="lesson-card"><h3>3. Entendimento</h3><p>${note[2]}</p><p>Observe hoje onde esse padrão aparece na sua rotina. Se você reconhece o exemplo, não transforme isso em culpa: transforme em uma decisão observável e pequena.</p><ul><li>O erro comum é tentar corrigir tudo de uma vez.</li><li>O sinal de progresso é conseguir repetir a ação em um dia normal.</li></ul></div><div class="lesson-card"><h3>4. Como aplicar na sua vida</h3><p>Adapte a ação ao seu horário, orçamento, condição física e contexto familiar. O protocolo não substitui avaliação profissional; quando houver sintomas persistentes, lesão ou condição clínica, procure orientação qualificada.</p><p><b>Exemplo:</b> prepare a menor versão executável da ação ainda hoje e deixe o próximo passo visível.</p></div><div class="lesson-card"><h3>5. Missão do dia</h3><p><b>${m.order}</b></p><h3 style="margin-top:18px">Passo a passo da execução</h3><ol class="step-list">${m.checks.map(c=>`<li>${c}</li>`).join('')}</ol></div><div class="section"><h3>Reflexão</h3><label for="reflection">${m.reflection}</label><textarea id="reflection" class="textarea" ${done||!available?'disabled':''}>${esc(state.reflections[activeDay]||'')}</textarea></div><div class="confirm-title">Confirme sua execução</div><div class="checklist">${['Li e entendi o conteúdo de hoje','Executei a missão principal','Fiz as mudanças propostas','Organizei o que preciso para amanhã'].map((c,i)=>`<label class="checkitem"><input type="checkbox" class="taskcheck" data-i="${i}" ${saved[i]?'checked':''} ${available?'':'disabled'}><span>${c}</span></label>`).join('')}</div><label class="execute"><input id="executed" type="checkbox" ${done?'checked disabled':''} ${available?'':'disabled'}>Eu executei o protocolo de hoje</label><div class="mission-actions"><button class="btn secondary" onclick="go('dashboard')">Voltar ao painel</button><button id="completeBtn" class="btn" ${done||!available?'disabled':''}>${done?'Dia concluído':available?'Concluir dia':'Desafio bloqueado'}</button></div></article>`}
function finalView(){let init=state.initial.scores,fin=state.final.scores;return `${header()}<section class="diagnostic"><span class="eyebrow">Protocolo concluído</span><h1 style="font-size:clamp(3rem,9vw,5.8rem)">Você não terminou um desafio.<br><span style="color:var(--gold)">Você construiu um novo padrão.</span></h1><p>Os últimos 21 dias provaram que seu ambiente, suas decisões e seus padrões podem ser reconstruídos. Agora, o próximo passo é continuar vivendo como um Testo Maxer.</p><div class="final-grid"><div class="card"><h3>Evolução percebida</h3>${questions.map((q,i)=>`<div class="compare"><span>${q}</span><b>${init[i]} → ${fin[i]}</b><span class="gain">${fin[i]-init[i]>=0?'+':''}${fin[i]-init[i]}</span></div>`).join('')}</div><div class="card"><span class="eyebrow">Sua jornada</span><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><strong>${state.completed.length}</strong><span>Missões</span></div><div class="stat"><strong>${state.maxStreak||21}</strong><span>Maior sequência</span></div></div><h3>Antes</h3><p>${esc(state.initial.open[2])}</p><h3>Agora</h3><p>${esc(state.final.open[0])}</p><h3>Compromisso</h3><p>${esc(state.final.open[1])}</p></div></div><div class="final-actions"><a class="btn" href="${CLUB_URL}" target="_blank" rel="noopener" style="text-decoration:none;text-align:center">Entrar para o Testo Maxer Club</a><button class="btn secondary" onclick="go('dashboard')">Revisar minha jornada</button></div><details class="demo"><summary>Gerenciar dados</summary><button class="btn danger" onclick="resetAll()">Apagar e reiniciar</button></details></section>`}
function bind(){let f=document.querySelector('#startForm');if(f)f.onsubmit=e=>{e.preventDefault();state.name=document.querySelector('#name').value.trim();if(!state.name)return;state.startedAt=Date.now();save();go('diagnostic')};document.querySelectorAll('.range').forEach(x=>x.oninput=()=>document.querySelector('#s'+x.id.slice(1)).textContent=x.value);let df=document.querySelector('#diagForm');if(df)df.onsubmit=e=>{e.preventDefault();let obj={scores:questions.map((_,i)=>+document.querySelector('#q'+i).value),open:[...document.querySelectorAll('.open-q textarea')].map(x=>x.value.trim())};if(view==='diagnostic'){state.initial=obj;save();go('dashboard')}else{state.final=obj;save();go('complete')}};let cb=document.querySelector('#completeBtn');if(cb&&!state.completed.includes(activeDay)){let refl=document.querySelector('#reflection'),ex=document.querySelector('#executed');let valid=()=>{let all=[...document.querySelectorAll('.taskcheck')].every(x=>x.checked);cb.disabled=!(refl.value.trim().length>=3&&ex.checked&&all)};refl.oninput=valid;ex.onchange=valid;valid();cb.onclick=()=>{state.reflections[activeDay]=refl.value.trim();state.checks[activeDay]=[...document.querySelectorAll('.taskcheck')].map(x=>x.checked);state.completed=[...new Set([...state.completed,activeDay])].sort((a,b)=>a-b);state.maxStreak=Math.max(state.maxStreak,streak());save();toast('DIA CONCLUÍDO. O PADRÃO FOI REFORÇADO.');setTimeout(()=>go('dashboard'),900)}}document.querySelectorAll('.taskcheck').forEach(x=>x.onchange=()=>{state.checks[activeDay]=[...document.querySelectorAll('.taskcheck')].map(y=>y.checked);save();let b=document.querySelector('#completeBtn');if(b){let r=document.querySelector('#reflection'),e=document.querySelector('#executed');b.disabled=!(r.value.trim().length>=3&&e.checked&&[...document.querySelectorAll('.taskcheck')].every(z=>z.checked))}});tick()}
function tick(){let el=document.querySelector('#countdown');if(!el)return;let u=unlocked(),target=state.startedAt+u*RELEASE_INTERVAL_MS,d=Math.max(0,target-Date.now()),h=Math.floor(d/36e5),m=Math.floor(d%36e5/6e4);el.textContent=`Próxima missão em ${h}h ${m}min`;setTimeout(tick,60000)}
function demoNext(){state.demoDay=Math.min(21,(state.demoDay||1)+1);save();render()}function resetAll(){if(confirm('Apagar todo o progresso e recomeçar?')){localStorage.removeItem(KEY);state=blank();view='start';render()}}function toast(t){document.querySelector('#toast').innerHTML=`<div class="success">${t}</div>`;setTimeout(()=>document.querySelector('#toast').innerHTML='',2200)}
render();
</script></body></html>
